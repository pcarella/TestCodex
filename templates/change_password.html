{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="login-card">
      <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
          <p class="text-uppercase text-muted fw-semibold mb-1 small">Sicurezza</p>
          <h1 class="login-title mb-2">Cambia password</h1>
          <p class="login-subtitle mb-0">Aggiorna la tua password per proteggere il tuo account.</p>
        </div>
      </div>
      <form method="post" action="{{ url_for('change_password') }}" class="login-form" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="row g-4">
          <div class="col-12">
            <label class="form-label" for="current_password">Password attuale</label>
            <input
              type="password"
              class="form-control"
              id="current_password"
              name="current_password"
              autocomplete="current-password"
              required
            />
          </div>
          <div class="col-12">
            <label class="form-label" for="new_password">Nuova password</label>
            <input
              type="password"
              class="form-control"
              id="new_password"
              name="new_password"
              autocomplete="new-password"
              required
            />
            <div class="form-text">Minimo 12 caratteri, includi maiuscole, minuscole e numeri.</div>
          </div>
          <div class="col-12">
            <label class="form-label" for="confirm_password">Conferma nuova password</label>
            <input
              type="password"
              class="form-control"
              id="confirm_password"
              name="confirm_password"
              autocomplete="new-password"
              required
            />
          </div>
        </div>
        <div class="d-flex justify-content-end mt-4">
          <button type="submit" class="btn btn-login text-white">Aggiorna password</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
